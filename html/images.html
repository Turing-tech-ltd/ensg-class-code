<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Version Management</h1>

    <!-- Create/Embed an Image  -->
    <img 
        src="../images/man-on-computer.jpg" 
        alt="A man working on a laptop"
        width="300"
        height="200"
        title="A man working on a laptop"
    >

    <!-- To make an image clickable -->
    <a href="https://www.github.com" target="_blank">
        <img 
            src="../images/man-on-computer.jpg" 
            alt="A man working on a laptop"
            width="200"
            height="150"
        >
    </a>
    
    <figure>
        <a href="https://www.github.com" target="_blank">
            <img 
                src="../images/man-on-computer.jpg" 
                alt="A man working on a laptop"
                width="200"
                height="150"
            >
        </a>

        <figcaption>
            A Well renowned Fullstack Developer
        </figcaption>
    </figure>    
    
</body>
</html>
