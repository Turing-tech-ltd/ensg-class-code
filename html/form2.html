<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <br>

            <label for="fname">
                Full Name 
                <span>*</span>
            </label>
            <input type="text" placeholder="Enter your fullname" id="fname" name="fname" minlength="5" maxlength="10" required>

            <br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="example@email.com">
            <br>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="18" max="40">
            <br>

            <label for="gender">Gender</label>
            <br>
            <input type="radio" name="gender" id="gender-male" value="male" required>
            <label for="gender-male">Male</label>
            
            <input type="radio" name="gender" id="gender-female" value="female" required>
            <label for="gender-female">Female</label>

        </fieldset>

        <br>

        <label for="framework">Choose your framework</label>
        <select name="framework" id="framework">
            <option value="">Select</option>
            <option value="react">React</option>
            <option value="vue">Vue</option>
            <option value="angular" selected>Angular</option>
        </select>

        <br>

        <label for="skills">Tools you work with</label>
        <br>
        <input type="checkbox" name="skills" value="html" id="html" checked>
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="css">
        <label for="css">CSS</label>
        <br>

        <label for="comment">Comment</label><br>
        <textarea name="comment" id="comment" rows=""  cols="" minlength="10" maxlength="15" placeholder="Your comment here..."></textarea>
        <br>

        <!-- Modern Approach -->
         <button type="submit">
            Submit
         </button>

         <button type="reset">
            Reset
         </button>
         <br>

         <!-- Old Approach -->
        <input type="button" value="Click Here">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        

    </form>
    
</body>
</html>
